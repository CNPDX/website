<footer class="site-footer">
  <div class="wrapper site-footer__inner">
    <div class="site-footer__brand">
      <img class="site-footer__logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo">
      <div>
        <p class="site-footer__title">{{ site.title }}</p>
        {%- if site.tagline -%}<p class="site-footer__tagline">{{ site.tagline }}</p>{%- endif -%}
      </div>
    </div>

    <p class="site-footer__copy">
      &copy; {{ site.time | date: '%Y' }} {{ site.author | default: site.title }}.
      {%- if site.email and site.email != "" %} <a href="mailto:{{ site.email }}">{{ site.email }}</a>.{% endif %}
    </p>
  </div>
</footer>
