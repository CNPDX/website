<header class="site-header">
  <div class="wrapper site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <img class="site-brand__logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo">
      <span class="site-brand__title">{{ site.title }}</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-toggle__label" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </label>

    <nav class="site-nav" aria-label="Primary">
      {%- for item in site.data.navigation -%}
        {%- assign url = item.url -%}
        <a class="site-nav__link{% if page.url == url or page.url contains url and url != '/' %} is-active{% endif %}"
           href="{{ url | relative_url }}">{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
